#!/system/bin/sh

# ════════════════════
# Box for Root - 配置文件
# ════════════════════

source /data/adb/box/scripts/box.lib

# ════════════════════
# 基础设置
# ════════════════════

# 开机自启
boot_auto_start="true"
current_time=$(date +"%H:%M")
box_user_group="root:net_admin"

# ════════════════════
# 代理核心配置
# ════════════════════

bin_name="sing-box"
bin_list=("mihomo" "sing-box" "xray" "v2fly" "hysteria")
bin_path="${bin_dir}/${bin_name}"
bin_log="${box_run}/${bin_name}.log"

# 启动时自动修改核心配置文件
auto_modify_config="true"

# ════════════════════
# 网络配置
# ════════════════════

# 网络模式: tun / tproxy / redirect / mixed / enhance
network_mode="tproxy"
tproxy_port="9898"
redir_port="9797"
ipv6="true"

quic="enable"
mihomo_dns_forward="enable"

# DNS 劫持策略: disable / tproxy/ redirect
dns_hijack_mode="tproxy"

# 绕过大陆 IP（需要设备支持 ipset）
bypass_cn_ip="true"
bypass_cn_ip_v4="true"
bypass_cn_ip_v6="true"
cn_ip_file="${box_run}/cn.zone"
cn_ipv6_file="${box_run}/cn_ipv6.zone"
cn_ip_url="https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt"
cn_ipv6_url="https://ispip.clang.cn/all_cn_ipv6.txt"

# 自定义 CNIP 绕过黑名单 
# 格式支持: [空间ID]:[包名]，不写空间ID默认为主空间，使用空格隔开包名
# 示例: 
# com.ss.android.ugc.aweme
# 999:com.ss.android.ugc.aweme
bypass_blacklist="com.ss.android.ugc.aweme.mobile"

# 热点场景 MAC 黑白名单（仅对热点/入站接口生效，默认关闭）
mac_filter="false"
mac_mode="blacklist"
macs_list=()

# ════════════════════
# 代理模式配置
# ════════════════════

# 代理模式: blacklist (黑名单) / whitelist (白名单) / core (核心模式)
proxy_mode="blacklist"

# ════════════════════
# 订阅管理
# ════════════════════

# Mihomo 订阅链接数组
subscription_url_mihomo=()
# Mihomo 订阅配置文件名数组
name_provide_mihomo_config=()
# Mihomo 订阅文件存放目录
mihomo_provide_path="/data/adb/box/mihomo/proxy_provider"

# 是否支持订阅中的自定义规则
custom_rules_subs="false"
name_provide_mihomo_rules="rules.yaml"
mihomo_provide_rules="${box_dir}/mihomo/provide/${name_provide_mihomo_rules}"

# Sing-box 订阅链接
subscription_url_singbox=""

# ════════════════════
# 网络状态控制
# ════════════════════

# 是否根据网络状态自动控制服务（总开关）
enable_network_service_control="false"
# WiFi 连接时是否启用模块
use_module_on_wifi="false"
# WiFi 断开时是否启用模块
use_module_on_wifi_disconnect="false"
# 是否启用 WiFi SSID 匹配
use_ssid_matching="false"
# SSID 匹配模式: blacklist (黑名单) / whitelist (白名单)
use_wifi_list_mode="blacklist"
# WiFi SSID 列表
wifi_ssids_list=("WiFi1" "WiFi2")
# 是否启用网络切换调试日志
inotify_log_enabled="false"

# ════════════════════
# 性能优化
# ════════════════════

# 内存限制
cgroup_memcg="false"
memcg_limit="100M"
# CPU 核心分配
cgroup_cpuset="true"
allow_cpu="0-5"
# 磁盘 I/O 权重
cgroup_blkio="false"
weight=""

# ════════════════════
# 核心配置文件路径
# ════════════════════

# Mihomo 配置文件
name_mihomo_config="config.yaml"
mihomo_config="${box_dir}/mihomo/${name_mihomo_config}"

# Sing-box 配置文件
name_sing_config="config.json"
sing_config="${box_dir}/sing-box/${name_sing_config}"

# Xray 配置文件
name_xray_config="config.json"
xray_config="${box_dir}/xray/${name_xray_config}"

# V2fly 配置文件
name_v2fly_config="config.json"
v2fly_config="${box_dir}/v2fly/${name_v2fly_config}"

# Hysteria 配置文件
name_hysteria_config="config.yaml"
hysteria_config="${box_dir}/hysteria/${name_hysteria_config}"

# ════════════════════
# 自动更新配置
# ════════════════════

# 是否启用定时任务
run_crontab="true"
# 定时任务时间
interva_update="0 8 * * *"

# true: 覆盖配置文件, false: 只更新订阅
renew="false"
# 是否启用订阅自动更新
update_subscription="false"
# 是否启用 GeoX 数据自动更新
update_geo="false"
#是否启用 CNIP 数据自动更新
update_cn_ip="true"

# 是否在启动/重启时清理 ColorOS16 注入的 Google 服务拦截规则
clean_google_rules="false"

# 是否根据 interva_update 定时清理（需同时设置 run_crontab="true"）
clean_google_crontab="false"

# GitHub 访问令牌
githubtoken=""
# 是否使用镜像加速 GitHub 下载
use_ghproxy="false"
# 镜像加速地址
url_ghproxy="https://ghfast.top"

# 核心版本: enable (稳定版) / disable (预发行版)
mihomo_stable="disable"
singbox_stable="disable"